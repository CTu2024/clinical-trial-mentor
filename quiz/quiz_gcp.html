<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCP法规百题自测</title>
<style>
  :root{
    --blue:#1a56db; --blue-light:#e8effc; --bg:#f5f7fa; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --green:#059669; --green-bg:#ecfdf5;
    --red:#dc2626; --red-bg:#fef2f2; --amber:#b45309; --amber-bg:#fffbeb;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
  .wrap{max-width:860px; margin:0 auto; padding:24px 16px 80px;}
  header{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-bottom:16px;}
  h1{font-size:20px; display:flex; align-items:center; gap:8px;}
  h1 .badge{font-size:12px; background:var(--blue-light); color:var(--blue); padding:2px 10px; border-radius:999px; font-weight:normal;}
  .stats{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  .stat{flex:1; min-width:110px; background:var(--bg); border-radius:10px; padding:8px 12px; text-align:center;}
  .stat b{font-size:20px; display:block;}
  .stat span{font-size:12px; color:var(--muted);}
  .bar{height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-top:12px;}
  .bar i{display:block; height:100%; background:var(--blue); width:0; transition:width .3s;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px;}
  .tab{padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:13px; color:var(--muted);}
  .tab.on{background:var(--blue); color:#fff; border-color:var(--blue);}
  .tools{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  select{padding:5px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); font-size:13px; color:var(--text);}
  .btn-reset{margin-left:auto; padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:13px;}
  .qcard{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px;}
  .qcard.right{border-color:#a7f3d0;}
  .qcard.wrong{border-color:#fecaca;}
  .qtop{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .num{font-size:12px; color:var(--muted);}
  .tag{font-size:11px; padding:1px 8px; border-radius:999px; background:var(--blue-light); color:var(--blue);}
  .tag.scene{background:var(--amber-bg); color:var(--amber);}
  .tag.judge{background:var(--green-bg); color:var(--green);}
  .qtext{font-size:15px; font-weight:600;}
  .ans{display:none; margin-top:12px; border-top:1px dashed var(--border); padding-top:12px;}
  .ans.show{display:block;}
  .ans ul{margin:0 0 4px 18px;}
  .ans li{font-size:14px; margin-bottom:4px;}
  .pit{background:var(--amber-bg); border-left:3px solid var(--amber); padding:8px 12px; border-radius:6px; font-size:13px; color:var(--amber); margin-top:8px;}
  .src{font-size:12px; color:var(--muted); margin-top:8px;}
  .ops{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  .btn{padding:6px 16px; border-radius:8px; cursor:pointer; font-size:13px; border:1px solid var(--border); background:var(--card);}
  .btn-primary{background:var(--blue); color:#fff; border-color:var(--blue);}
  .btn-ok{background:var(--green-bg); color:var(--green); border-color:#a7f3d0;}
  .btn-no{background:var(--red-bg); color:var(--red); border-color:#fecaca;}
  .verdict{font-size:13px; margin-left:auto;}
  .verdict.ok{color:var(--green);} .verdict.no{color:var(--red);}
  .hint-count{font-size:12px; color:var(--muted); text-align:center; margin:10px 0 0;}
  @media print{ .ops,.tabs,.tools{display:none} .ans{display:block} }
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#185fa5">
<meta name="mobile-web-app-capable" content="yes">

<body>
<div class="wrap">
  <header>
    <h1>GCP法规百题自测 <span class="badge">仅基于GCP法规 · 136条知识库</span></h1>
    <p style="font-size:13px;color:var(--muted);margin-top:6px;">全部题目来源：2026版GCP全景知识点手册.pdf + 2026版GCP完整正文（gcp_2026_full.md），不引用其他实操文件</p>
    <div class="stats">
      <div class="stat"><b id="s-done">0</b><span>已作答</span></div>
      <div class="stat"><b id="s-ok" style="color:var(--green)">0</b><span>答对</span></div>
      <div class="stat"><b id="s-no" style="color:var(--red)">0</b><span>答错</span></div>
      <div class="stat"><b id="s-total">100</b><span>总题数</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <select id="fstate">
        <option value="all">全部状态</option>
        <option value="todo">只看未答</option>
        <option value="ok">只看答对</option>
        <option value="no">只看答错</option>
      </select>
      <button class="btn-reset" id="reset">重置进度</button>
    </div>
  </header>
  <div id="list"></div>
  <p class="hint-count" id="count"></p>
  <p style="text-align:center;margin-top:16px;"><a href="./" style="font-size:13px;color:var(--blue);">&larr; 返回问答助手</a> &nbsp;|&nbsp; <a href="quiz.html" style="font-size:13px;color:var(--blue);">综合百题自测 &rarr;</a></p>
</div>

<script>
const QS = [
// ===== 1. 2026版GCP新规总则（1-15）=====
{n:1, stage:"GCP总则", type:"情景", q:"2026年8月，某药企准备启动一项III期临床试验，预计9月10日正式招募。有人说\"反正还在2026年，用2020版GCP就行\"。这个说法对吗？",
 a:["不对。2026版GCP自2026年9月1日起施行，同日废止2020版","9月1日之后启动的试验必须执行2026版GCP","同时需接轨ICH E6(R3)国际标准"],
 pit:"时间节点是硬线：9月1日前启动的试验可按旧规执行，但9月1日后的新试验必须用新规。", src:"GCP手册·名词解释 / gcp_2026_full·修订概述"},

{n:2, stage:"GCP总则", type:"情景", q:"某申办者在设计III期方案时，把所有环节都做了\"最高标准\"的风险管控——每个中心都派驻2名监查员、每周现场监查。这样做符合新版GCP的要求吗？",
 a:["不完全符合。2026版GCP强调\"风险相称\"原则","质量管理和监查措施应与试验的复杂程度、参与者风险、数据重要性相匹配","过度管控会降低效率，也不符合\"符合目的\"理念","应基于风险分级，将资源聚焦高风险环节"],
 src:"GCP手册·名词解释 / gcp_2026_full·第四十条"},

{n:3, stage:"GCP总则", type:"情景", q:"某PI在试验方案设计时说：\"方案写好就行了，质量靠后期监查来保证。\"这个想法在2026版GCP下能过关吗？",
 a:["不能。新版GCP首次纳入\"质量源于设计（QbD）\"核心理念","要求在设计阶段就系统识别关键质量因素及风险","将质量要求嵌入试验全流程设计，而非仅依靠事后核查","方案中需体现QbD方法和风险控制措施"],
 pit:"QbD是2026版GCP最大的理念升级，方案不体现QbD，伦理审查会打回。", src:"GCP手册·名词解释 / gcp_2026_full·第六条"},

{n:4, stage:"GCP总则", type:"判断", q:"2026版GCP把原来的9章83条精简为6章54条，其中删除了试验方案、研究者手册、必备文件管理三章。这意味着这些文件不再重要了。",
 a:["错。删除这三章是因为按ICH E6(R3)执行","文件管理要求并未放松，而是对接国际标准","同时新增了\"数据治理\"专章，对数据要求更严"],
 src:"gcp_2026_full·修订概述"},

{n:5, stage:"GCP总则", type:"情景", q:"一份知情同意书中写道：\"参加本试验即视为放弃对申办方和研究者的索赔权利。\"某CRC觉得这样能减少纠纷。这个条款能通过伦理审查吗？",
 a:["不能。新版GCP明确：知情同意书不得含有要求试验参与者放弃合法权益的内容","也不得免除研究者、临床试验机构、申办者及相关服务供应商应承担的责任","这类条款属于重大伦理缺陷，伦理审查委员会必然打回"],
 src:"GCP手册·名词解释 / gcp_2026_full·第四十五条"},

{n:6, stage:"GCP总则", type:"简答", q:"2026版GCP中\"受试者\"改称为什么？\"伦理委员会\"改称为什么？为什么做这些术语变更？",
 a:["\"受试者\"改称\"试验参与者\"——更人性化，与2023伦理审查办法、2024赫尔辛基宣言对齐","\"伦理委员会\"改称\"伦理审查委员会\"——强调审查职能","权益保护范围从\"权益、安全\"扩大到\"权益、安全和福祉\""],
 src:"gcp_2026_full·修订概述"},

{n:7, stage:"GCP总则", type:"情景", q:"一个临床试验团队在用Excel表格记录试验数据，理由是\"EDC系统太贵了，Excel也一样能记录\"。如果药品监管部门来检查，会认可吗？",
 a:["不会认可。新版GCP要求计算机化系统需通过验证","系统需具备权限管理、稽查轨迹、数据备份功能","Excel无法满足稽查轨迹（记录所有操作的创建者、修改者、修改时间）的要求","eCRF系统需通过验证，符合预期用途与数据治理要求"],
 pit:"用Excel替代专业EDC系统是最常见的数据合规缺陷之一。", src:"GCP手册·关键流程与文档要求 / gcp_2026_full·第五十三条"},

{n:8, stage:"GCP总则", type:"情景", q:"某试验参与者因参加试验导致肝损伤住院，申办方说\"这是受试者自身体质问题，不是我们的责任\"，拒绝支付医疗费。根据GCP，谁应承担费用？",
 a:["申办者应承担试验参与者因试验相关损害的诊疗费用及相应补偿","申办者应提供法律上、经济上的保险或保证，覆盖试验参与者风险","但不包括主要研究者和临床试验机构自身的过失所致的损害","申办者和主要研究者应及时兑付补偿或赔偿"],
 pit:"\"试验相关损害\"的补偿是法定义务，不能以\"自身体质\"推脱。", src:"GCP手册·试验各方职责 / gcp_2026_full·第四十五条"},

{n:9, stage:"GCP总则", type:"简答", q:"2026版GCP的六个章节分别是什么？哪一章是新增的？",
 a:["第一章 总则（1-13条）","第二章 伦理审查委员会（14-17条）","第三章 主要研究者和药物临床试验机构（18-31条）","第四章 申办者（32-50条）","第五章 数据治理（51-53条）——新增","第六章 附则（54条）"],
 src:"gcp_2026_full·修订概述"},

{n:10, stage:"GCP总则", type:"情景", q:"某研究者在试验中遇到了利益冲突情况——他的妻子是申办方的高管。他没有告知任何人，继续参与了试验。这违反了GCP哪条规定？",
 a:["违反了GCP中的\"利益冲突回避原则\"","2026版GCP第十二条明确：临床试验的实施应当遵守利益冲突回避原则","避免对试验参与者权益和安全以及试验结果可靠性产生影响","伦理审查委员会也需建立利益冲突管理机制"],
 src:"gcp_2026_full·第十二条 / GCP手册·试验各方职责"},

{n:11, stage:"GCP总则", type:"情景", q:"某机构的数据管理员在录入CRF时发现一个数据明显不合理，他没有报告研究者，直接在eCRF系统里改了数据。这个操作合规吗？",
 a:["不合规。申办者不得更改研究者及其授权人员或试验参与者录入的数据","除非有正当理由，且必须在修改前获得主要研究者的书面同意","所有修改需进行记录","CRF数据的修改需留痕，由研究者或授权人操作，注明修改理由、签名及日期"],
 pit:"擅改数据是GCP红线，可能被认定为数据造假。", src:"gcp_2026_full·第四十八条 / GCP手册·关键流程与文档要求"},

{n:12, stage:"GCP总则", type:"简答", q:"GCP的四大核心原则是什么？请简述每一条的含义。",
 a:["伦理原则：试验参与者权益和安全是首要考虑因素，优先于科学和社会获益","科学原则：试验需有充分科学依据，获益大于风险时方可实施","法律法规原则：遵守药品管理法、疫苗管理法等及相关法规","风险相称原则：质量管理、监查稽查、风险控制措施需与风险程度相匹配"],
 src:"GCP手册·名词解释"},

{n:13, stage:"GCP总则", type:"情景", q:"某新药刚拿到临床试验许可，PI说\"方案还需要修改几个入排标准，但伦理已经批了上一版，先按我改的来执行，后面再补伦理审批。\"这样行吗？",
 a:["不行。试验方案须经伦理审查委员会批准后方可执行","如需调整方案，必须再次获得伦理审查委员会批准后方可执行","不得在未获伦理批准的情况下擅自修改方案执行","为消除对试验参与者的紧急危害而偏离方案，可先执行后报告，但需及时报告并说明理由"],
 pit:"\"先改后报\"是方案偏离的高发场景，非紧急情况不得先斩后奏。", src:"gcp_2026_full·第七条 / 第二十三条"},

{n:14, stage:"GCP总则", type:"简答", q:"药物临床试验全过程包括哪些阶段？GCP是覆盖全过程的质量标准吗？",
 a:["全过程包括：计划、启动、执行、记录、监督、评估、分析和报告","GCP是药物临床试验全过程的质量标准","涵盖方案设计、组织实施、监查、稽查、记录、分析、总结和报告"],
 src:"gcp_2026_full·第三条 / GCP手册·名词解释"},

{n:15, stage:"GCP总则", type:"判断", q:"凡涉及医学判断或者医疗决策，可以由经过培训的CRC来做出。",
 a:["错。GCP第八条明确：凡涉及医学判断或者医疗决策应当由有资质的临床医生做出","CRC可以协助数据录入、参与者随访，但不能做医学判断","PI负责的临床试验决策、关键确认原则上不得授权"],
 src:"gcp_2026_full·第八条 / 第二十条"},

// ===== 2. 伦理审查与知情同意（16-40）=====
{n:16, stage:"伦理与知情", type:"简答", q:"伦理审查委员会的组成有哪些要求？可以只由医生组成吗？",
 a:["不能只由医生组成","需由医学、药学及其他背景人员（含法律专家、非医务人员）组成","需有不同性别委员","会议审查需各类别委员参与，满足法定人数","投票委员需独立于被审查项目","可邀请外部专家参与，但专家无投票权"],
 src:"GCP手册·名词解释 / gcp_2026_full·第十五条"},

{n:17, stage:"伦理与知情", type:"情景", q:"某伦理审查委员会的跟踪审查频率设定为每18个月审查一次。这符合GCP要求吗？",
 a:["不符合。伦理审查跟踪审查频率时间间隔不超过12个月","即至少每年1次","高风险试验还应增加审查频次"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二章"},

{n:18, stage:"伦理与知情", type:"情景", q:"某试验参与者签署知情同意书后，试验过程中发现了新的SUSAR。研究者觉得\"已经签过ICF了，不用再签\"。这种做法对吗？",
 a:["不对。出现可能影响参与者继续参与意愿的新信息时，需及时告知并重新获取知情同意","必要时应当再次签署知情同意书","只有经伦理审查委员会审查同意后，新版知情同意书方可使用","已入组的参与者需重新签署新版ICF（若其继续参加试验）"],
 pit:"\"已签过就不补签\"是最常见的知情同意违规。", src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:19, stage:"伦理与知情", type:"简答", q:"知情同意书的内容至少需要包含哪些方面？请说出至少8项。",
 a:["临床试验概况和目的","试验治疗及随机分配至各组的可能性","试验参与者需遵守的试验步骤（含创伤性操作）","试验可能的风险/不便","试验预期获益及不能获益的可能性","其他可选药物/治疗方法","试验相关损害的补偿与治疗","自愿参加原则（可拒绝或随时退出，无歧视/报复）","监查员、稽查员、伦理委员会、药监部门可直接查阅原始医学记录","试验参与者身份信息保密","联系人和联系方式","试验预期持续时间和预计人数"],
 src:"GCP手册·名词解释"},

{n:20, stage:"伦理与知情", type:"情景", q:"某试验参与者不识字，无法阅读知情同意书。研究者说\"那就口头告诉他，让他按个手印就行。\"这样做合规吗？",
 a:["不完全合规。试验参与者或其法定代理人缺乏阅读能力时，应当有一位公正见证人见证整个知情同意过程","公正见证人需与试验无关、无利益关联","见证人需阅读ICF并确认试验参与者/监护人理解","公正见证人需在ICF上签字并注明日期","如试验参与者口头同意，在其有能力的情况下应尽量签署ICF"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:21, stage:"伦理与知情", type:"情景", q:"一个15岁的青少年参加临床试验，监护人同意了，但青少年本人说\"我不想参加\"。研究者可以因为监护人同意就让青少年参加吗？",
 a:["不可以。未成年人作为试验参与者，当未成年人有能力做出同意决定时，还需征得其本人同意","如未成年参与者本人不同意或中途退出，即使法定代理人同意，也以未成年人本人的决定为准","除非是严重或危及生命疾病的治疗性试验，且PI和法定代理人认为不参加会有生命危害","此时法定代理人的同意可使试验参与者参加"],
 pit:"儿童意愿优先是GCP对弱势参与者保护的核心。", src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:22, stage:"伦理与知情", type:"情景", q:"知情同意书的签署日期：试验参与者签署日期是8月15日，研究者签署日期是8月16日。监查员核查时说有问题。什么问题？",
 a:["知情同意书要求：研究者与试验参与者的签署日期需为同一天","日期不一致说明知情同意过程可能存在问题","病历中应当记录试验参与者知情同意的具体时间和人员"],
 src:"GCP手册·名词解释"},

{n:23, stage:"伦理与知情", type:"情景", q:"某试验参与者在签署知情同意书之前，研究者就安排了抽血化验做筛选检查。理由是\"反正筛选检查很常规，先做了节省时间\"。这样做对吗？",
 a:["不对。签署知情同意书之前，不得进行任何临床试验相关的操作","包括筛选检查（如病史询问、体格检查、实验室检测）","知情同意书的签署时间需在试验所有程序之前（方案特殊规定除外）"],
 pit:"\"先检查后知情\"是最严重的伦理违规之一。", src:"GCP手册·试验各方职责 / gcp_2026_full·第二十七条"},

{n:24, stage:"伦理与知情", type:"情景", q:"某试验参与者签署知情同意书后，研究者把ICF原件归档了，没给参与者副本。参与者后来想了解试验信息找不到。这违反了什么规定？",
 a:["违反了知情同意书归档要求","知情同意书一式两份：1份由试验参与者（或其监护人）保管，1份由研究者归档","试验参与者应获得ICF原件或副本","电子知情同意书需按数据治理要求妥善存储"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:25, stage:"伦理与知情", type:"情景", q:"紧急情况下，一位昏迷的试验参与者被送入急诊，无法签署知情同意书，监护人也不在场。这时该怎么做？",
 a:["试验方案中需明确入选方式并经伦理审查委员会批准","监护人可代表同意，若监护人不在场，按方案预设程序执行","需尽快告知试验参与者或其监护人试验信息","适时获得知情同意","参与者病情稳定后尽快获得其本人或监护人的后续同意"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:26, stage:"伦理与知情", type:"判断", q:"一位无民事行为能力的试验参与者，只需要其法定代理人书面知情同意即可参加试验。",
 a:["对。试验参与者为无民事行为能力人的，需其法定代理人（监护人）书面知情同意","但限制民事行为能力人需本人及监护人共同书面知情同意","限制民事行为能力人恢复民事行为能力后，需再次获得其本人自愿同意方可继续"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:27, stage:"伦理与知情", type:"简答", q:"弱势试验参与者包括哪些群体？伦理审查委员会需对弱势群体做什么？",
 a:["包括：研究者的学生和下级、申办者的员工、军人、犯人、无药可救疾病的患者、处于危急状况的患者、入住福利院的人、流浪者、未成年人和无能力知情同意的人等","伦理审查委员会需对弱势试验参与者的保护措施进行重点审查","确保其权益得到充分保障"],
 src:"GCP手册·名词解释"},

{n:28, stage:"伦理与知情", type:"情景", q:"某伦理审查委员会对一项试验给出了\"修改后再审\"的意见。研究者觉得\"反正问题不大，改完直接开始吧\"。这样可以吗？",
 a:["不可以。\"修改后再审\"意味着需要修改后重新提交审查，获得最终\"批准\"后才能执行","审查意见类型包括：批准、不批准、修改后批准、修改后再审、继续研究、暂停或终止研究","仅有修改后再审意见、未取得最终批准的，不得视为审查通过","不得仅凭口头通知启动试验"],
 src:"GCP手册·名词解释"},

{n:29, stage:"伦理与知情", type:"简答", q:"伦理审查的基本原则有哪五条？",
 a:["试验参与者权益优先原则：权益和安全高于科学和社会利益","科学性原则：审查方案科学性，确保设计合理","合规性原则：符合赫尔辛基宣言、GCP及相关法律法规，接轨ICH E6(R3)","公正性原则：独立开展审查，不受干扰，公平对待所有参与者","风险相称原则：风险与预期获益需成合理比例"],
 src:"GCP手册·试验各方职责"},

{n:30, stage:"伦理与知情", type:"情景", q:"某试验用招募广告写着\"参加本试验，免费体检+营养补贴，名额有限，先到先得！\"这个广告能通过伦理审查吗？",
 a:["可能不通过。招募广告不得采用误导性、利诱性内容","广告内容需真实，无误导、无利诱","需经伦理审查委员会批准后才能使用","知情同意需采用通俗易懂的语言，不得采用强迫、利诱等不正当方式影响参与者决定"],
 pit:"\"名额有限，先到先得\"构成利诱，\"免费体检\"夸大获益。", src:"GCP手册·试验各方职责 / gcp_2026_full·第二十七条"},

{n:31, stage:"伦理与知情", type:"情景", q:"某试验参与者在知情同意过程中问研究者：\"如果我中途不想参加了，可以退出吗？会不会影响我的治疗？\"研究者应该怎么回答？",
 a:["试验参与者可无理由随时退出试验，无歧视或报复","权益不受影响","研究者需尊重其退出权利，尽量了解退出理由","给予适当的随访和医疗处理"],
 src:"GCP手册·试验各方职责 / gcp_2026_full·第二十四条"},

{n:32, stage:"伦理与知情", type:"情景", q:"研究者签署知情同意书时，在知情同意书首页或签署页签名了，但忘记注明日期。监查员发现了这个问题。这算什么问题？",
 a:["知情同意书签署时，研究者需签名并注明日期","未注明日期属于签署不完整，是合规缺陷","病历中应当记录试验参与者知情同意的具体时间和人员"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:33, stage:"伦理与知情", type:"简答", q:"伦理审查委员会需向主要研究者和申办者提供哪些书面审查文件？",
 a:["伦理审查委员会名称和地址","参与项目审查的伦理审查委员会委员名单","审查意见","符合GCP及相关法律法规的审查声明","必要时，PI、申办者或药监部门可要求伦理审查委员会提供其标准操作规程"],
 src:"gcp_2026_full·第十七条"},

{n:34, stage:"伦理与知情", type:"情景", q:"某试验方案修正案增加了新的入排标准，PI签了字就发给各中心执行了，没有提交伦理审查。这违反了什么？",
 a:["违反了方案修正案审查要求","方案修正案需经伦理审查委员会审查同意后方可在各中心实施","修正案需说明修改理由、对参与者权益的影响","方案修正案需注明版本号、日期"],
 src:"GCP手册·试验各方职责 / gcp_2026_full·第七条"},

{n:35, stage:"伦理与知情", type:"判断", q:"伦理审查委员会的所有审查记录用于注册的试验，需保存至药物获批上市后5年；未用于注册的试验，至少保存至试验终止后5年。",
 a:["对。这是GCP对伦理审查记录保存期限的明确规定","同样适用于临床试验必备文件的保存期限"],
 src:"GCP手册·名词解释 / gcp_2026_full·第十六条"},

{n:36, stage:"伦理与知情", type:"情景", q:"一位儿童试验参与者在试验过程中达到了签署知情同意书的年龄。研究者应该怎么做？",
 a:["儿童达到签署年龄后，需本人签署ICF方可继续试验","在临床试验过程中，未成年参与者达到了签署知情同意书的条件，则需要由本人签署知情同意书之后方可继续实施"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:37, stage:"伦理与知情", type:"情景", q:"一位限制民事行为能力人在参加试验期间恢复了完全民事行为能力。研究者需要做什么？",
 a:["限制民事行为能力人在恢复民事行为能力后，需要对其再次知情同意","获得其本人的自愿同意继续或退出相关临床试验"],
 src:"gcp_2026_full·第二十七条"},

{n:38, stage:"伦理与知情", type:"情景", q:"某知情同意书中有一段文字写着\"本试验无预期获益\"。这种情况下，知情同意书应该由谁签署？",
 a:["无预期获益的临床试验，原则上应当由试验参与者本人签署知情同意书","不能用法定代理人代签（除非是紧急情况等特殊情形）"],
 src:"GCP手册·名词解释 / gcp_2026_full·第二十七条"},

{n:39, stage:"伦理与知情", type:"简答", q:"知情同意签订流程有哪几个步骤？请说出至少5个关键步骤。",
 a:["使用经伦理审查委员会同意的最新版ICF","在单独、安静的环境中，以通俗易懂的语言充分告知","给予充足时间提问和考虑","参与者（或监护人）签字并注明日期","研究者同时签字并注明日期","若无阅读能力，需公正见证人见证全过程并签字","参与者需获得ICF原件或副本"],
 src:"GCP手册·名词解释"},

{n:40, stage:"伦理与知情", type:"情景", q:"研究者收到申办者发来的SUSAR报告后，随手放在抽屉里没处理。一周后参与者问起新风险，研究者才想起来。这个做法有什么问题？",
 a:["主要研究者收到SUSAR、其他潜在严重安全性风险信息、DSUR等信息后应当及时签阅","应当考虑试验参与者的治疗是否需要调整","必要时尽早与试验参与者沟通","如安全性信息影响参与者继续参与意愿，需更新ICF并重新获取知情同意"],
 pit:"\"收到不签阅\"是安全性信息管理的常见缺陷。", src:"gcp_2026_full·第二十六条 / 第四十四条"},

// ===== 3. 研究者与机构职责（41-55）=====
{n:41, stage:"研究者职责", type:"情景", q:"某PI把\"入排确认单\"的签署工作授权给了CRC，说\"你帮我签字就行\"。这在新版GCP下合规吗？",
 a:["不合规。PI负责的临床试验决策、关键确认，以及向伦理审查委员会、临床试验机构和申办者的正式报告原则上不得授权","入排确认属于\"关键确认\"范畴","PI需对其授权委托的活动承担最终责任","但不可授权事项必须亲力亲为"],
 pit:"代签入排单在稽查中被发现，属于严重方案偏离。", src:"GCP手册·名词解释 / gcp_2026_full·第二十条"},

{n:42, stage:"研究者职责", type:"简答", q:"PI（主要研究者）和CI（合作研究者）的区别是什么？PI的不可授权事项有哪些？",
 a:["PI是临床试验现场的最终责任人，对试验质量和参与者安全负总责","CI是在PI指导下协助开展工作的研究者","PI不可授权事项：临床试验决策、关键确认、向伦理/机构/申办者的正式报告","PI对授权委托的活动承担最终责任"],
 src:"GCP手册·名词解释 / 附则"},

{n:43, stage:"研究者职责", type:"情景", q:"某PI在一个试验中同时入组了50名参与者，但他每周只有半天时间在试验病房。监查员认为他可能不符合PI的资质要求。监查员的判断有道理吗？",
 a:["有道理。GCP要求PI需有足够的时间和能力组织、实施临床试验","需在合同约定的期限内入组足够数量且符合方案的参与者","如果PI时间精力不足，可能无法保障试验质量和参与者安全"],
 src:"gcp_2026_full·第十九条 / 第二十一条"},

{n:44, stage:"研究者职责", type:"情景", q:"某研究者为了加快入组速度，在伦理审查委员会批准方案之前就开始筛选参与者了。这个行为在GCP中怎么定性？",
 a:["严重违规。GCP明确：临床试验实施前，PI应当获得伦理审查委员会对临床试验项目的批准","未获得同意前，不得筛选试验参与者","同时申办者还需获得药品监督管理部门的临床试验许可或完成备案"],
 src:"gcp_2026_full·第二十二条 / 第三十八条"},

{n:45, stage:"研究者职责", type:"情景", q:"试验过程中，一位参与者出现了紧急的严重不良事件，需要知道用的是试验药还是对照药来决定急救方案。PI决定紧急破盲。破盲后需要做什么？",
 a:["需立即记录破盲时间、原因、操作人","破盲后该参与者需终止试验，按脱落病例处理","立即将破盲结果和参与者情况告知监查员和申办者","在CRF中详细记录破盲过程及理由，签名确认","评估破盲对整体盲态和试验结果的影响"],
 src:"GCP手册·关键流程与文档要求 / gcp_2026_full·第二十三条"},

{n:46, stage:"研究者职责", type:"情景", q:"某研究者发现试验方案有一个不合理的设计，他直接修改了方案并执行，没有报告任何人。一个月后才在进展报告中提了一下。这违反了什么？",
 a:["违反了方案偏离报告要求","如为消除对参与者的紧急危害而偏离方案，需及时向伦理审查委员会、申办者报告并说明理由","如为其他原因偏离方案，需记录偏离原因、影响，并采取措施防止再次发生","方案修改需先提交伦理审查委员会审查同意后才能执行","不得擅自修改方案"],
 src:"gcp_2026_full·第二十三条"},

{n:47, stage:"研究者职责", type:"情景", q:"某试验提前终止了，PI通知了申办方但没有告知试验参与者，也没有安排后续治疗和随访。这违反了什么规定？",
 a:["违反了试验终止处理要求","临床试验提前终止或暂停，PI应当及时通知试验参与者","并给予参与者适当的治疗和随访","PI还应立即向非发起方报告（如申办者终止，需报告伦理和机构；伦理终止，需报告申办者和机构）","提供书面说明"],
 src:"gcp_2026_full·第二十四条"},

{n:48, stage:"研究者职责", type:"简答", q:"作为PI，在试验准备阶段需要签署哪些关键文件？至少说出5种。",
 a:["试验方案及修正案（与申办者共同签署）","研究者申明（承诺遵守GCP和方案、保护参与者权益等）","知情同意书（确认内容完整合规）","临床试验合同","职责分工授权表","研究者履历及资质证明"],
 src:"GCP手册·附则"},

{n:49, stage:"研究者职责", type:"情景", q:"某试验中，一位CRC代替研究者做了入排判断，理由是\"PI太忙了，我比PI更了解方案细节\"。这种做法在GCP视角下有什么问题？",
 a:["严重违规。凡涉及医学判断或医疗决策应当由有资质的临床医生做出","入排判断属于医学判断，CRC不能代替","PI负责的临床试验决策原则上不得授权","CRC可协助数据录入、参与者随访等非医学判断工作"],
 pit:"CRC代签入排单、代做医学判断是稽查中的高频违规项。", src:"gcp_2026_full·第八条 / 第二十条"},

{n:50, stage:"研究者职责", type:"情景", q:"某PI认为试验药物管理是药剂科的事，自己不用管。试验药物过期了2个月他都不知道。这符合GCP要求吗？",
 a:["不符合。PI对试验用药品负有管理责任","PI应指派具备相应资质的专人管理","PI应确保试验用药品按照试验方案使用","向参与者说明正确使用方法","PI应确保药物在有效期内使用","过期药物需及时回收处理"],
 src:"gcp_2026_full·第二十八条"},

{n:51, stage:"研究者职责", type:"情景", q:"某研究者完成了一例试验参与者的观察后，3个月才将研究病历交给PI审核签名。这符合GCP要求吗？",
 a:["不符合。研究者需在3个工作日内将研究病历、知情同意书、服药记录卡交主要研究者审核签名","1周内将所有数据归档至临床试验机构的资料档案室"],
 src:"GCP手册·关键流程与文档要求"},

{n:52, stage:"研究者职责", type:"简答", q:"PI需具备哪些条件才能担任主要研究者？至少说出4项。",
 a:["在临床试验机构的相应执业资格","具备临床试验所需的教育背景、培训经历和实践经验","经GCP培训合格","熟悉试验方案、研究者手册、试验用药品相关资料","有足够的时间和精力组织、实施临床试验","有权支配所需人员和设施"],
 src:"GCP手册·附则 / gcp_2026_full·第十九条"},

{n:53, stage:"研究者职责", type:"情景", q:"某试验参与者退出试验后，研究者直接将其数据从数据库中删除了，理由是\"人退出了，数据也没用了\"。这违反了什么？",
 a:["严重违规。脱落病例的所有已收集数据需纳入临床试验数据库，不得随意剔除","统计分析时需按方案规定的数据集（如全分析集FAS、符合方案集PP）处理","若数据缺失，需按预设的缺失数据处理方法分析","临床试验脱落率一般应控制在20%以内"],
 pit:"删除退出者数据在GCP视角下属于数据篡改。", src:"GCP手册·关键流程与文档要求"},

{n:54, stage:"研究者职责", type:"情景", q:"临床试验完成后，PI把总结报告写好就交给了申办方，没有向临床试验机构报告。这遗漏了什么？",
 a:["PI应当向临床试验机构书面报告试验完成","PI应向伦理审查委员会提供试验结果摘要","PI应向申办者提供临床试验总结报告","协助申办者向药品监督管理部门提交临床试验报告"],
 src:"gcp_2026_full·第三十条"},

{n:55, stage:"研究者职责", type:"情景", q:"药品监督管理部门来检查了，PI说\"源数据在CRC电脑里，CRC今天请假了，你们改天再来\"。这样做有什么问题？",
 a:["PI和临床试验机构应当接受药品监督管理部门的检查","配合提供所需的与临床试验有关的记录","不得以任何理由拒绝或拖延检查","文件需易于查找、调阅，防止丢失或损坏"],
 src:"gcp_2026_full·第三十一条"},

// ===== 4. 申办者职责（56-70）=====
{n:56, stage:"申办者职责", type:"情景", q:"某申办者把全部试验工作委托给了CRO，然后说\"都交给你们了，出问题你们负责\"。这符合GCP吗？",
 a:["不符合。申办者仍是临床试验数据质量和可靠性的最终责任人","申办者需对CRO等供应商承担最终责任","不能以合同转移法定责任","CRO需实施质量保证和质量控制","若CRO存在任务转包，需获得申办者书面批准"],
 pit:"\"全甩给CRO\"是申办者最常见的合规陷阱。", src:"GCP手册·名词解释 / gcp_2026_full·第三十六条"},

{n:57, stage:"申办者职责", type:"情景", q:"某申办者在试验开始前没有向药品监督管理部门提交临床试验资料，直接让各中心开始筛选参与者了。这违反了什么？",
 a:["违反了GCP第三十八条","临床试验开始前，申办者应当向国务院药品监督管理部门提交相关临床试验资料","获得临床试验许可或完成生物等效性试验备案","同时应获取伦理审查委员会相关记录并执行伦理审查意见"],
 src:"gcp_2026_full·第三十八条"},

{n:58, stage:"申办者职责", type:"情景", q:"某申办者发现某中心反复出现方案偏离，但没有采取任何措施，继续让该中心参与试验。这违反了什么？",
 a:["违反了GCP第四十三条","发现严重、持续的不依从问题时，申办者应考虑终止该研究者、机构或供应商继续参加试验","及时书面报告伦理审查委员会","采取措施将对参与者和试验结果的影响降至最小","如问题严重，可追究相关人员责任并报告药监部门"],
 src:"gcp_2026_full·第四十三条"},

{n:59, stage:"申办者职责", type:"情景", q:"某申办者收到一份SUSAR报告后，觉得\"不太确定是不是真的有关，先观察观察再报\"。30天后才上报。这违反了什么时限要求？",
 a:["违反了快速报告时限","致死或危及生命的SUSAR：申办者需在首次获知后7日内报告药品监督管理部门","其他SUSAR：需在15日内报告","申办者需将SUSAR快速通报所有参与试验的研究者、机构、伦理审查委员会"],
 pit:"\"先观察再报\"是最危险的SUSAR上报延误场景。", src:"GCP手册·名词解释 / gcp_2026_full·第四十四条"},

{n:60, stage:"申办者职责", type:"简答", q:"申办者在风险管理方面需要做哪些工作？",
 a:["试验开始前和整个过程中识别可能影响关键质量因素的风险","评估风险发生的可能性、可检测程度、对参与者保护和结果可靠性的影响","预先设定风险控制可接受范围，超出时评估是否采取措施","记录已识别的风险和缓解措施，与相关人员沟通","定期审查风险控制措施，根据新知识调整"],
 src:"gcp_2026_full·第四十二条"},

{n:61, stage:"申办者职责", type:"情景", q:"某申办者的监查员同时也是稽查员，理由是\"一个人做两份事更高效\"。这符合GCP要求吗？",
 a:["不符合。稽查人员需独立于临床试验，不得由监查员兼任","稽查独立于常规监查或质量控制职能之外","目的是评估试验管理、实施和相关参与方是否符合方案、GCP和监管要求"],
 pit:"\"监查员兼稽查员\"违背了稽查的独立性原则。", src:"GCP手册·名词解释 / gcp_2026_full·第四十一条"},

{n:62, stage:"申办者职责", type:"情景", q:"某申办者在知情同意书中明确说明：\"试验结束后剩余生物样品可以由申办者自行使用。\"这符合GCP要求吗？",
 a:["不完全符合。申办者应在知情同意书中明确说明剩余生物样品的保存或将来可能被使用等情况","包括保存时间、数据保密性问题","以及在何种情况下数据和生物样品可以共享","禁止实施与伦理审查委员会批准的试验方案无关的生物样品检测（如基因检测）"],
 src:"gcp_2026_full·第三十七条"},

{n:63, stage:"申办者职责", type:"情景", q:"某申办者使用未经伦理批准的方案就向各中心发放了试验用药品。这违反了什么？",
 a:["违反了GCP第四十六条","临床试验获得伦理审查委员会批准和药品监督管理部门许可或备案之后，申办者才可向PI和机构提供试验用药品","不得在未获批前发药"],
 src:"gcp_2026_full·第四十六条"},

{n:64, stage:"申办者职责", type:"情景", q:"某申办者的试验用药品标签上没有标明\"仅用于临床试验\"。这违反了什么要求？",
 a:["违反了试验用药品标签要求","标签上应当标明\"仅用于临床试验\"、临床试验信息和临床试验用药品信息","盲法试验中标签应能保持盲态"],
 src:"gcp_2026_full·第四十六条"},

{n:65, stage:"申办者职责", type:"情景", q:"在盲法试验中，某申办者没有建立紧急揭盲的规程和机制。如果发生紧急SAE需要揭盲，怎么办？",
 a:["这违反了GCP要求。申办者应建立紧急揭盲的规程和机制","以便在紧急医学状态必须揭盲时能够快速识别临床试验用药品","同时保持其他参与者治疗分配的盲态","紧急揭盲信件一式两份，分别由PI和申办者保存"],
 src:"GCP手册·名词解释 / gcp_2026_full·第四十六条"},

{n:66, stage:"申办者职责", type:"情景", q:"某申办者暂停了一项临床试验，但没有书面告知PI、机构和伦理审查委员会。这违反了什么？",
 a:["违反了GCP第五十条","申办者暂停或提前终止临床试验或申办者变更的，应当及时书面告知PI和机构、伦理审查委员会","并说明理由"],
 src:"gcp_2026_full·第五十条"},

{n:67, stage:"申办者职责", type:"简答", q:"申办者在数据治理方面有哪些具体责任？",
 a:["确保电子数据管理系统满足计算机化系统要求","不得更改研究者录入的数据，除非有正当理由且获PI书面同意","使用试验参与者鉴认代码识别数据","制定统计分析计划，对统计编程和数据处理实施质量管理","保存临床试验必备记录，书面告知各方保存要求"],
 src:"gcp_2026_full·第四十八条"},

{n:68, stage:"申办者职责", type:"情景", q:"某申办者没有在方案或合同中明确监查员、稽查员、伦理审查者和药监部门可以直接查阅源记录的权限。参与者也不知道这些人在需要时可以看他们的原始医学记录。这有什么问题？",
 a:["违反了GCP第四十九条","申办者应在方案或合同中明确各方允许直接查阅源记录","申办者应确认每位参与者均以书面形式同意上述查阅权"],
 src:"gcp_2026_full·第四十九条"},

{n:69, stage:"申办者职责", type:"情景", q:"某申办者没有给试验购买任何保险。试验参与者因试验药物导致严重肝损伤后，申办方说\"没有保险，我们赔不起\"。这违反了什么？",
 a:["违反了GCP第四十五条","申办者应提供法律上、经济上的保险或保证，用于补偿或赔偿临床试验相关的损害","保险应与风险性质和风险程度相适应","申办者应承担参与者参加试验相关损害的诊疗费用及相应补偿","申办者和PI应及时兑付补偿或赔偿"],
 src:"gcp_2026_full·第四十五条"},

{n:70, stage:"申办者职责", type:"情景", q:"某申办者提交的临床试验报告中，部分数据与源记录不一致。申办者解释说\"可能是录入时出了小差错\"。这在GCP视角下是什么性质的问题？",
 a:["严重问题。GCP要求临床试验报告应当全面、完整、准确反映临床试验结果","临床试验数据应当与源记录一致","数据不一致需要做出合理解释","如存在数据编造或篡改，属于严重违规","药品监督管理部门可采取警告、暂停试验、撤销许可等措施"],
 src:"gcp_2026_full·第五十条"},

// ===== 5. 试验设计与实施（71-85）=====
{n:71, stage:"试验设计", type:"情景", q:"某I期临床试验招募了健康受试者，年龄范围18-50岁。PK（药代动力学）试验的年龄范围应该是多少？同批参与者年龄差有什么要求？",
 a:["I期耐受性试验：18-50岁","I期PK试验：18-45岁","同批参与者年龄差不宜超过10岁","生物等效性试验：18-40岁，年龄差不宜超过10岁"],
 src:"GCP手册·试验各方职责"},

{n:72, stage:"试验设计", type:"简答", q:"新药临床试验分几期？各期试验组最低例数分别是多少？",
 a:["I期：20-30例（健康人，特殊药物可选肿瘤患者）","II期：不少于100例（患者）","III期：不少于300例（患者，多中心）","IV期：无明确最低例数（上市后监测）","生物等效性试验：18-24例（通常19-25例）"],
 src:"GCP手册·名词解释"},

{n:73, stage:"试验设计", type:"情景", q:"某II期临床试验中，试验组与对照组的比例设为5:1（试验组500例，对照组100例）。有人说对照组只有100例太少了吧？这个比例合规吗？",
 a:["通常为1:1（最常用，统计效率最高）","若需提高试验药暴露量可采用2:1或3:1，但需在方案中说明理由","且对照组例数不得少于100例（II期、III期）","5:1的比例需在方案中充分论证理由"],
 src:"GCP手册·名词解释"},

{n:74, stage:"试验设计", type:"情景", q:"某双盲试验中，试验药是片剂，对照药是胶囊。试验参与者一眼就能看出自己吃的是哪种药。盲态被破坏了。这个问题怎么解决？",
 a:["应采用双模拟（Double Dummy）技术","为试验药制备对照药的安慰剂（模拟对照药）","为对照药制备试验药的安慰剂（模拟试验药）","使两组参与者接受的用药外观、给药方式完全一致"],
 pit:"剂型不一致不做双模拟，是盲态破坏的常见原因。", src:"GCP手册·名词解释"},

{n:75, stage:"试验设计", type:"情景", q:"某研究者问：\"临床试验是采用有效假设还是无效假设？\"请回答并解释原因。",
 a:["采用无效假设（Null Hypothesis）","假设试验药物与对照药物（或安慰剂）在主要疗效指标上无差异","通过临床试验收集数据检验是否能\"拒绝无效假设\"","若差异具有统计学意义（如P<0.05），则拒绝无效假设，认为试验药可能有效","从参与者保护角度，默认药物\"无效\"，需充分证据证明其有效"],
 src:"GCP手册·关键流程与文档要求"},

{n:76, stage:"试验设计", type:"情景", q:"某试验中，研究者按自己的判断来分配参与者到试验组或对照组，而不是按随机分配表。这会带来什么问题？",
 a:["破坏随机化设计","可能导致分组偏倚——研究者主观意愿影响分组","使组间基线特征不均衡","影响试验结果的统计学可靠性","发药时必须严格按入组顺序和药物编码次序，不得跳号或调整编码"],
 pit:"\"研究者自行分组\"是随机化设计的根本性破坏。", src:"GCP手册·名词解释"},

{n:77, stage:"试验设计", type:"简答", q:"临床试验设计的四大基本原则是什么？简述每一条的目的。",
 a:["对照原则：设置对照组排除病情自然发展、安慰剂效应等非试验因素","随机原则：参与者有同等机会分配到各组，避免分组偏倚","盲法原则：隐藏治疗分配，减少主观评价偏倚","重复原则：足够样本量确保结果可重复性","另需融入质量源于设计（QbD）原则"],
 src:"GCP手册·名词解释"},

{n:78, stage:"试验设计", type:"情景", q:"某交叉设计临床试验中，参与者在第一个周期吃了试验药A，紧接着直接进入第二周期吃对照药B，中间没有间隔。这会有什么问题？",
 a:["缺少药物清洗期","清洗期用于消除前一治疗阶段药物对当前试验药物的影响","清洗期时长通常不少于5个消除半衰期（T₁/₂）","无清洗期可能导致前一药物残留影响后一药物的药代动力学或药效学"],
 src:"GCP手册·试验各方职责"},

{n:79, stage:"试验设计", type:"情景", q:"某试验参与者的依从性计算结果为65%。研究者觉得还行，继续试验。这需要怎么处理？",
 a:["依从性良好范围通常为80%-120%","低于80%需分析原因（如药物不良反应、遗忘、理解偏差）","低于60%可能需在统计分析中单独评估或作为脱落病例处理","需采取改进措施（如加强宣教、设置服药提醒）"],
 src:"GCP手册·关键流程与文档要求"},

{n:80, stage:"试验设计", type:"情景", q:"某双盲试验的盲底保存在PI的办公桌抽屉里，任何人都能看到。这符合GCP要求吗？",
 a:["不符合。盲底需密封保存","试验总盲底一式两份，密封后由申办者保存","一份用于揭盲，一份长期密封备查","双盲试验需制定紧急破盲程序","应急信件一式两份，分别由PI和申办者保存","需符合数据治理的安全存储要求"],
 src:"GCP手册·名词解释"},

{n:81, stage:"试验设计", type:"情景", q:"某双盲临床试验设计为试验组:对照组=1:1。数据锁定后，统计师说\"可以做两次揭盲\"。请解释什么时候做一级揭盲、什么时候做二级揭盲？",
 a:["一级揭盲：数据库锁定后、统计分析开始前","拆阅一级盲底，明确每个参与者所属处理组别（如A组/B组），不告知组别对应的药物类型","将结果交统计学家与数据库链接进行统计分析","二级揭盲：统计分析完成、总结报告初稿撰写后","拆阅二级盲底，宣布各组对应的实际药物类型"],
 src:"GCP手册·附则"},

{n:82, stage:"试验设计", type:"情景", q:"某双盲试验设计为试验组:对照组=3:1，统计师说只能做一次揭盲。这合理吗？",
 a:["合理。非1:1分组的双盲试验，一级揭盲后可直接关联药物类型时，仅需一次揭盲","操作流程参照一级揭盲，揭盲后直接明确组别与药物的对应关系"],
 src:"GCP手册·名词解释"},

{n:83, stage:"试验设计", type:"情景", q:"某试验的脱落率达到了35%。统计师担心影响试验结论。GCP对脱落率有什么要求？",
 a:["临床试验脱落率一般应控制在20%以内","若脱落率过高，需在总结报告中说明原因","评估脱落对结果可靠性的影响","脱落病例所有已收集数据需纳入数据库，不得随意剔除"],

const STAGES = [...new Set(QS.map(q=>q.stage))];
const STAGE_COLORS = {  };
const KEY = 'gcp_quiz_v1';

// ---- render ----
const list = document.getElementById('list');
const tabsEl = document.getElementById('tabs');
let curStage = 'all';
let curState = 'all';

// tabs
STAGES.forEach((s,i)=>{
  const el = document.createElement('span');
  el.className = 'tab' + (i===0?' on':'');
  el.textContent = s;
  el.onclick = ()=>{ curStage = s; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); el.classList.add('on'); render(); };
  tabsEl.appendChild(el);
});
// add "全部" tab
const allTab = document.createElement('span');
allTab.className = 'tab';
allTab.textContent = '全部';
allTab.onclick = ()=>{ curStage='all'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); allTab.classList.add('on'); render(); };
tabsEl.insertBefore(allTab, tabsEl.firstChild);
allTab.classList.add('on');

document.getElementById('fstate').onchange = function(){ curState = this.value; render(); };
document.getElementById('reset').onclick = function(){
  if(confirm('确定重置所有答题进度？')){
    localStorage.removeItem(KEY);
    location.reload();
  }
};

// load progress
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}

function saveProgress(){ localStorage.setItem(KEY, JSON.stringify(progress)); }

function render(){
  list.innerHTML = '';
  let shown = 0;
  QS.forEach(q=>{
    if(curStage!=='all' && q.stage!==curStage) return;
    const st = progress[q.n];
    if(curState==='todo' && st) return;
    if(curState==='ok' && st!=='ok') return;
    if(curState==='no' && st!=='no') return;
    shown++;

    const card = document.createElement('div');
    card.className = 'qcard' + (st==='ok'?' right':'') + (st==='no'?' wrong':'');
    const typeTag = q.type==='情景' ? 'tag scene' : q.type==='判断' ? 'tag judge' : 'tag';
    card.innerHTML = `
      <div class="qtop">
        <span class="num">第 ${q.n} 题</span>
        <span class="${typeTag}">${q.type}</span>
        <span class="tag">${q.stage}</span>
        ${st==='ok' ? '<span class="verdict ok">&#10003; 答对</span>' : ''}
        ${st==='no' ? '<span class="verdict no">&#10007; 答错</span>' : ''}
      </div>
      <div class="qtext">${q.q}</div>
      <div class="ans" id="ans-${q.n}">
        <ul>${q.a.map(x=>`<li>${x}</li>`).join('')}</ul>
        ${q.pit ? `<div class="pit">&#9888; ${q.pit}</div>` : ''}
        <div class="src">来源：${q.src}</div>
      </div>
      <div class="ops">
        <button class="btn btn-primary" onclick="toggle(${q.n})">显示答案</button>
        ${st ? '<span style="font-size:12px;color:var(--muted)">已自评：'+(st==='ok'?'答对':'答错')+'</span>' : `
        <button class="btn btn-ok" onclick="mark(${q.n},'ok')">答对了</button>
        <button class="btn btn-no" onclick="mark(${q.n},'no')">答错了</button>`}
      </div>
    `;
    list.appendChild(card);
  });
  document.getElementById('count').textContent = shown < QS.length ? `当前显示 ${shown} 题 / 共 ${QS.length} 题` : `共 ${QS.length} 题`;
  updateStats();
}

function toggle(n){
  const el = document.getElementById('ans-'+n);
  el.classList.toggle('show');
}
function mark(n, verdict){
  progress[n] = verdict;
  saveProgress();
  render();
}

function updateStats(){
  const done = Object.keys(progress).length;
  const ok = Object.values(progress).filter(v=>v==='ok').length;
  const no = Object.values(progress).filter(v=>v==='no').length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-no').textContent = no;
  document.getElementById('bar').style.width = (done/QS.length*100)+'%';
}

render();
</script>

  });
