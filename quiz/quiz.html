<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>临床试验百题自测</title>
<style>
  :root{
    --blue:#1a56db; --blue-light:#e8effc; --bg:#f5f7fa; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --green:#059669; --green-bg:#ecfdf5;
    --red:#dc2626; --red-bg:#fef2f2; --amber:#b45309; --amber-bg:#fffbeb;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
  .wrap{max-width:860px; margin:0 auto; padding:24px 16px 80px;}
  header{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-bottom:16px;}
  h1{font-size:20px; display:flex; align-items:center; gap:8px;}
  h1 .badge{font-size:12px; background:var(--blue-light); color:var(--blue); padding:2px 10px; border-radius:999px; font-weight:normal;}
  .stats{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  .stat{flex:1; min-width:110px; background:var(--bg); border-radius:10px; padding:8px 12px; text-align:center;}
  .stat b{font-size:20px; display:block;}
  .stat span{font-size:12px; color:var(--muted);}
  .bar{height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-top:12px;}
  .bar i{display:block; height:100%; background:var(--blue); width:0; transition:width .3s;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px;}
  .tab{padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:13px; color:var(--muted);}
  .tab.on{background:var(--blue); color:#fff; border-color:var(--blue);}
  .tools{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  select{padding:5px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); font-size:13px; color:var(--text);}
  .btn-reset{margin-left:auto; padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:13px;}
  .qcard{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px;}
  .qcard.right{border-color:#a7f3d0;}
  .qcard.wrong{border-color:#fecaca;}
  .qtop{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .num{font-size:12px; color:var(--muted);}
  .tag{font-size:11px; padding:1px 8px; border-radius:999px; background:var(--blue-light); color:var(--blue);}
  .tag.scene{background:var(--amber-bg); color:var(--amber);}
  .tag.judge{background:var(--green-bg); color:var(--green);}
  .qtext{font-size:15px; font-weight:600;}
  .ans{display:none; margin-top:12px; border-top:1px dashed var(--border); padding-top:12px;}
  .ans.show{display:block;}
  .ans ul{margin:0 0 4px 18px;}
  .ans li{font-size:14px; margin-bottom:4px;}
  .pit{background:var(--amber-bg); border-left:3px solid var(--amber); padding:8px 12px; border-radius:6px; font-size:13px; color:var(--amber); margin-top:8px;}
  .src{font-size:12px; color:var(--muted); margin-top:8px;}
  .ops{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  .btn{padding:6px 16px; border-radius:8px; cursor:pointer; font-size:13px; border:1px solid var(--border); background:var(--card);}
  .btn-primary{background:var(--blue); color:#fff; border-color:var(--blue);}
  .btn-ok{background:var(--green-bg); color:var(--green); border-color:#a7f3d0;}
  .btn-no{background:var(--red-bg); color:var(--red); border-color:#fecaca;}
  .verdict{font-size:13px; margin-left:auto;}
  .verdict.ok{color:var(--green);} .verdict.no{color:var(--red);}
  .hint-count{font-size:12px; color:var(--muted); text-align:center; margin:10px 0 0;}
  @media print{ .ops,.tabs,.tools{display:none} .ans{display:block} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>临床试验百题自测 <span class="badge">基于 5 份资料 · 845 条知识库</span></h1>
    <div class="stats">
      <div class="stat"><b id="s-done">0</b><span>已作答</span></div>
      <div class="stat"><b id="s-ok" style="color:var(--green)">0</b><span>答对</span></div>
      <div class="stat"><b id="s-no" style="color:var(--red)">0</b><span>答错</span></div>
      <div class="stat"><b id="s-total">100</b><span>总题数</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <select id="fstate">
        <option value="all">全部状态</option>
        <option value="todo">只看未答</option>
        <option value="ok">只看答对</option>
        <option value="no">只看答错</option>
      </select>
      <button class="btn-reset" id="reset">重置进度</button>
    </div>
  </header>
  <div id="list"></div>
  <p class="hint-count" id="count"></p>
</div>

<script>
const QS = [
// ============ GCP 法规基础 (1-15) ============
{n:1, stage:"GCP法规", type:"简答", q:"2026版GCP什么时候施行？由哪些部门发布？",
 a:["2026年9月1日起施行，2020版同日废止","国家药监局、国家卫健委、国家中医药局、国家疾控局联合发布","2026年3月31日后启动的试验全面实施ICH E6(R3)"],
 pit:"别记混时间节点：3月31日是新旧试验分界线，9月1日是正式施行日。", src:"2026版GCP全景知识点手册"},
{n:2, stage:"GCP法规", type:"简答", q:"新版GCP首次纳入的三大核心理念是什么？",
 a:["质量源于设计（QbD）","符合目的（Fit for Purpose）","风险相称（Proportionality）——贯穿从设计到执行的全流程"],
 src:"2026版GCP全景知识点手册"},
{n:3, stage:"GCP法规", type:"简答", q:"新版GCP新增了哪个专章？核心内容有哪些？",
 a:["数据治理专章","数据全生命周期管理、盲态保持","计算机化系统验证、电子签名法律效力"],
 pit:"数据治理是2026版最大增量，注册申报、监查稽查都会专项核查，别当成可选项。", src:"2026版GCP全景知识点手册"},
{n:4, stage:"GCP法规", type:"简答", q:"PI作为“现场最终责任人”，哪些事项原则上不得授权？",
 a:["试验决策（如入排判定、医疗判断）","关键确认（入排确认单、CSR签署等）","正式报告、临床中心管理、人员职责分配"],
 pit:"PI签字必须亲笔，代签的文件（如CSR、入排确认单）会被判无效。", src:"2026版GCP / 全流程1·SIV章"},
{n:5, stage:"GCP法规", type:"简答", q:"申办方把工作外包给CRO后，责任怎么算？",
 a:["申办方仍是临床试验相关活动的最终责任人","对CRO等供应商承担最终责任，不能以合同转移法定责任"],
 src:"2026版GCP全景知识点手册"},
{n:6, stage:"GCP法规", type:"简答", q:"“受试者”这个称呼在新版GCP里有什么变化？",
 a:["统一改称“试验参与者”","更人性化，体现对人的尊重","权益保护范围从“权益、安全”扩大到“权益、安全和福祉”"],
 src:"2026版GCP全景知识点手册"},
{n:7, stage:"GCP法规", type:"简答", q:"试验相关记录的保存期限，新规怎么规定？",
 a:["注册试验：保存至药物获批上市后5年","其他试验：终止后5年","疫苗/医疗器械类资料：至上市后10年","到期销毁必须走审批流程，不可擅自处理"],
 pit:"按旧规提前归档销毁是常见违规点，监查稽查时无据可依。", src:"2026版GCP / 全流程3·CSR存档章"},
{n:8, stage:"GCP法规", type:"简答", q:"未成年人参加试验，知情同意有什么新要求？",
 a:["未成年人本人同意优先","需法定代理人（监护人）代签","落实“双知情双同意”：先向监护人讲清风险/费用/赔偿/退出规则，再向未成年人讲清要做什么（抽血、吃药）"],
 src:"2026版GCP / 全流程2·知情同意章"},
{n:9, stage:"GCP法规", type:"判断", q:"伦理批准的方案里没写基因检测，但留着血样可惜，可以顺便做个基因分析。（对还是错？）",
 a:["错。新版GCP禁止方案外检测（如基因检测）","剩余样品的处理方式必须在方案中明确"],
 pit:"生物样品管理是新版GCP强化重点，“顺便做一下”就是违规。", src:"2026版GCP全景知识点手册"},
{n:10, stage:"GCP法规", type:"简答", q:"ALCOA+数据质量原则指什么？",
 a:["ALCOA：可归因、清晰、同步、原始、准确","+：完整、一致、持久、可获得"],
 pit:"访视当天没填CRF、事后补录，违反的就是“同步性(C)”。", src:"GCP知识点 / 全流程2"},
{n:11, stage:"GCP法规", type:"简答", q:"“风险相称”原则在实践中怎么体现？",
 a:["伦理审查、安全性报告等按风险程度采取相称的管理方式，不搞一刀切","监查资源聚焦高风险环节和高风险中心，而非平均用力"],
 src:"2026版GCP全景知识点手册"},
{n:12, stage:"GCP法规", type:"简答", q:"QbD（质量源于设计）的定义是什么？",
 a:["在试验设计阶段就系统识别关键质量因素及相关风险","采用与风险程度相称的控制措施，从源头保证质量"],
 src:"2026版GCP全景知识点手册"},
{n:13, stage:"GCP法规", type:"简答", q:"GCP的核心目的是什么？",
 a:["保证临床试验过程规范，数据和结果科学、真实、可靠","保护试验参与者的权益和安全","遵循《赫尔辛基宣言》原则及伦理要求"],
 src:"2026版GCP全景知识点手册"},
{n:14, stage:"GCP法规", type:"简答", q:"使用EDC/CTMS等计算机化系统，合规要求有哪些？",
 a:["系统需完成验证（IQ/OQ/PQ）","具备权限管理、审计轨迹、电子签名功能","所有操作自动留痕；不可用普通办公表格（Excel等）替代专业系统"],
 src:"2026版GCP / 全流程2·电子系统章"},
{n:15, stage:"GCP法规", type:"简答", q:"电子数据发现录错了，正确和错误的修改方式分别是什么？",
 a:["正确：走审批流程修正，保留完整审计轨迹","错误：直接覆盖/删除原始数据","纸质记录：划改+签字+日期，严禁涂抹"],
 pit:"擅自修正会被判定为“数据造假”，这是最严重的红线之一。", src:"全流程2/3·数据管理章"},

// ============ 前期准备 (16-35) ============
{n:16, stage:"前期准备", type:"简答", q:"初次电话联系意向PI，哪些话题不能聊？为什么？",
 a:["不聊样本量计算方法、统计分析计划、数据治理技术细节","应聚焦：入组例数、试验参与者获益、研究者工作量"],
 pit:"在电话里聊专业细节容易暴露不专业，给PI留下负面第一印象。", src:"全流程1·1.5避坑指南"},
{n:17, stage:"前期准备", type:"判断", q:"为了促成合作，可以对PI承诺“保证3个月入完20例、经费再涨20%”。（对还是错？）",
 a:["错。不承诺无法兑现的条件","可留余地说“我们会协助加快入组、可与申办方沟通经费调整”","不得承诺减免PI核心职责——新版GCP明确PI是现场最终责任人"],
 src:"全流程1·1.5避坑指南"},
{n:18, stage:"前期准备", type:"简答", q:"中心调研的6大核心考量点，至少说出4个。",
 a:["研究者团队（经验、GCP资质）","患者资源（门诊量、竞争项目）","机构立项与伦理审查流程效率","科室设施设备、检验科能力","数据管理基础（是否用CTMS等）","机构备案资质有效性"],
 src:"全流程1·1.2.2"},
{n:19, stage:"前期准备", type:"简答", q:"中心调研阶段的保密协议有什么要求？",
 a:["调研时必须签署保密协议","申办方需留存1份","涉及遗传资源信息的，需额外明确遗传信息保密责任"],
 pit:"没留存保密协议，后续申办方可能以“无保密追溯依据”拒绝推进项目。", src:"全流程1·1.2.3"},
{n:20, stage:"前期准备", type:"简答", q:"如何确认一家中心的GCP备案资质有效？",
 a:["务必通过官方渠道查询确认","不得仅依据既往合作经验判断"],
 pit:"资质过期会导致项目立项直接被驳回。", src:"全流程1·1.5避坑指南"},
{n:21, stage:"前期准备", type:"简答", q:"机构立项资料怎样准备才容易被机构老师接受？",
 a:["按医院官网的“立项资料清单”顺序分类装订（基础/资质/数据文件分文件夹）","核对清单是否为适配2026版GCP的最新版本","原件/复印件用便签标注（如“PI签字原件”“批件复印件盖公章”）","PI签字必须亲笔，不得代签"],
 src:"全流程1·2.5避坑指南"},
{n:22, stage:"前期准备", type:"简答", q:"立项资料递交后，跟进的节奏怎么把握？",
 a:["递交后3-5天跟进1次，不每天催促","跟进时重点询问“是否有需要补充的新版合规资料”","所有沟通记录（微信、签收单、电子提交截图）存档"],
 src:"全流程1·2.5避坑指南"},
{n:23, stage:"前期准备", type:"简答", q:"伦理委员会的人员组成有什么要求？",
 a:["需有医学、药学、伦理学、法律等专业背景的委员","需有非科学背景人士（社区代表）","不同性别委员参加","少数民族地区应考虑少数民族委员"],
 src:"全流程1·3.1.2"},
{n:24, stage:"前期准备", type:"情景", q:"伦理上会时，委员问了一个SAE处理流程的问题，PI回答得不完整，你（CRC/CRO）很懂，该怎么做？",
 a:["仅在PI未说全时补充，不抢话不越位","涉及医疗判断、知情同意等核心事项，必须由PI作答"],
 pit:"上会抢PI的话是大忌，会让委员质疑团队分工和PI履职能力。", src:"全流程1·3.6避坑指南"},
{n:25, stage:"前期准备", type:"简答", q:"领取伦理批件时要核对哪些内容？",
 a:["项目名称、PI、有效期、跟踪审查要求","审查结论须为正式“批准”或“修改后批准（已核验通过）”","仅有修改后再审意见、未取得最终批准的，不得视为审查通过","有错误当场改，避免后续启动会无效；不得仅凭口头通知启动试验"],
 src:"全流程1·3.6避坑指南"},
{n:26, stage:"前期准备", type:"简答", q:"伦理审查费用预算为什么要额外预留20%？",
 a:["医院实际收费可能明显高于预期（如预估5000元、实际需8000元）","在申办方预算中额外预留20%避免超支"],
 src:"全流程1·3.6避坑指南"},
{n:27, stage:"前期准备", type:"判断", q:"ICF里可以写“参加本试验即视为放弃对研究者的索赔权利”。（对还是错？）",
 a:["错。新版GCP明确禁止“免除申办方/研究者责任”“放弃索赔权利”等表述","属于重大伦理缺陷，伦理必打回"],
 src:"全流程1·3.6避坑指南"},
{n:28, stage:"前期准备", type:"判断", q:"多中心临床试验的人遗申报，为了加快进度可以拆成多个单中心项目分别申报。（对还是错？）",
 a:["错。严禁拆分申报规避审批","多中心项目必须由组长单位统一申报","拆分申报属于严重违规"],
 src:"全流程1·4.8避坑指南"},
{n:29, stage:"前期准备", type:"简答", q:"人遗办常规审批周期大约多久？立项计划要怎么排？",
 a:["常规审批约20-30个工作日（不含材料补正时间）","不涉及信息出境的国际合作临床试验备案可实现工作日内确认","立项排期时需提前规划这个周期"],
 src:"全流程1·4.6"},
{n:30, stage:"前期准备", type:"简答", q:"人遗申报时，实验室质控证明有什么时效要求？",
 a:["必须是近3个月内的质控证明","半年前的不被伦理/机构认可，需重新索取","涉及遗传资源检测的实验室还需核实对应资质"],
 src:"全流程1·4.8避坑指南"},
{n:31, stage:"前期准备", type:"简答", q:"什么样的单位会被认定为“外方单位”？",
 a:["境外组织、个人持有50%以上股份、股权、表决权等权益的单位","设在港澳的内资实控机构有特殊认定规则"],
 src:"全流程1·4.2"},
{n:32, stage:"前期准备", type:"简答", q:"合同里的机构管理费和科室管理费，常见比例是多少？",
 a:["两项合计通常占合同总额的10%-20%","例如：机构管理费15%+科室管理费5%（按医院规定执行）"],
 src:"全流程1·5.1"},
{n:33, stage:"前期准备", type:"简答", q:"合同条款里，SAE发生后申办方要提供什么支持？时限是？",
 a:["研究者获知SAE后24小时内填写《严重不良事件报告》","申办方48小时内派医学专员协助处理"],
 src:"全流程1·5.2"},
{n:34, stage:"前期准备", type:"简答", q:"召开SIV（启动会）前必须满足的“必达条件”有哪些？",
 a:["伦理批件在有效期内、合同已生效（首款按约定支付）","试验用药品到位且温控运输记录合格","物资耗材到位、EDC/CTMS账号开通","SIV前1天再次复核这些前提"],
 pit:"“别忽视启动前提复核”——启动会开了但前提没落实，等于白开。", src:"全流程1·6.1/6.6"},
{n:35, stage:"前期准备", type:"简答", q:"ISF（研究者文件夹）运行期间，新文件归档有时限要求吗？",
 a:["监查报告：每次监查后3个工作日内归档","伦理跟踪审查批件：领取后1周内归档","新增文件需及时归档，确保随时可查"],
 src:"全流程1·6.2.3"},

// ============ 中期执行 (36-65) ============
{n:36, stage:"中期执行", type:"情景", q:"你发现已批准的招募海报上有个错别字，自己拿笔改掉就行？（对还是错？）",
 a:["错。任何修改都需先告知PI","修改后重新签字，再提交伦理审核","私下涂改会被伦理核查判定为“材料不合规”；数字化宣传内容同样需与伦理批准版完全一致"],
 src:"全流程2·7.5避坑指南"},
{n:37, stage:"中期执行", type:"简答", q:"招募推荐表、意向表里，参与者的手机号要怎么处理？",
 a:["隐去中间4位（如“138****5678”）","电子档存于加密文件夹","符合《个人信息保护法》与2026版GCP隐私保护要求"],
 src:"全流程2·7.5避坑指南"},
{n:38, stage:"中期执行", type:"判断", q:"为了调动门诊医生推荐患者的积极性，可以私下给推荐医生发现金红包。（对还是错？）",
 a:["错。激励需通过医院正规渠道发放（如科研经费转账）","私下现金支付有商业贿赂风险","所有激励发放记录需存档并纳入机构财务台账"],
 src:"全流程2·7.5避坑指南"},
{n:39, stage:"中期执行", type:"情景", q:"筛选期，参与者拿出1个月前的门诊肝功能报告说“不用重复查了吧”，你怎么处理？",
 a:["不能直接使用，需重新做试验专用检查","保证数据时效性（期间指标可能变化）","同时保证检测方法、仪器统一，符合数据可比性要求"],
 src:"全流程2·8.6避坑指南"},
{n:40, stage:"中期执行", type:"简答", q:"筛选失败的原因，病历上写“不符合入组标准”可以吗？",
 a:["不可以，需具体量化","正确写法如：“HbA1c 10.2%，方案上限10.0%”","所有筛选失败案例完整记录，纳入筛选漏斗分析"],
 pit:"模糊描述在监查时无法追溯，等于白记。", src:"全流程2·8.6避坑指南"},
{n:41, stage:"中期执行", type:"情景", q:"CRC第一次随机号操作错了，再取一个新号就行了？（对还是错？）",
 a:["错。随机号不可重复获取","需联系申办方冻结原随机号","避免随机号混乱；所有系统操作保留审计轨迹"],
 src:"全流程2·8.6避坑指南"},
{n:42, stage:"中期执行", type:"情景", q:"参与者说“我明天出差，今天先把知情同意书签了吧”，可以通融吗？",
 a:["不可以，需拒绝","坚持给予充足的阅读时间（ICF充分阅读理解后才能签署）","提前签署会被伦理判定为违规；不得以“参与者主动要求”为由突破法规底线"],
 src:"全流程2·9.6避坑指南"},
{n:43, stage:"中期执行", type:"简答", q:"谁不能担任知情同意的见证人？谁可以？",
 a:["不可以：科室护士、CRC等研究团队人员","可以：参与者家属、社区工作者等非研究相关人员","见证人需全程在场见证知情与签署过程"],
 src:"全流程2·9.6避坑指南"},
{n:44, stage:"中期执行", type:"简答", q:"ICF签署日期怎么填？参与者6月19日签的，能写6月18日或20日吗？",
 a:["必须写实际签署日（2024.6.19）","提前或延后都会影响监查追溯","电子签署需保留精确时间戳"],
 src:"全流程2·9.6避坑指南"},
{n:45, stage:"中期执行", type:"简答", q:"知情同意过程除了ICF本身，还必须记录在哪里？",
 a:["必须在参与者的门诊/住院病史中记录知情同意的具体时间和执行人员","这是2026版GCP的明确要求"],
 pit:"病史里漏记知情时间和执行人，会被判定为知情同意流程不规范——很多新人栽在这里。", src:"全流程2·9.6避坑指南"},
{n:46, stage:"中期执行", type:"简答", q:"Teach-back（回授）法是什么？用来解决什么问题？",
 a:["签署前用3个核心问题让参与者复述试验关键信息","验证其真正理解，避免“表面同意”"],
 src:"全流程2·9.3.2"},
{n:47, stage:"中期执行", type:"简答", q:"未成年受试者的知情同意怎么做？",
 a:["双知情双同意：先向监护人讲解试验风险、费用、赔偿、退出规则","再向未成年人讲解需要做什么（抽血、吃药）、有什么好处（免费检查治疗）","未成年人本人同意优先"],
 src:"全流程2·9.2.2"},
{n:48, stage:"中期执行", type:"简答", q:"入组后的基线数据采集，时限要求是什么？",
 a:["入组后48小时内完成基线数据采集","含基线体格检查、实验室检查、基线CRF填写与审核"],
 src:"全流程2·10.2"},
{n:49, stage:"中期执行", type:"判断", q:"基线体检量出身高175.3cm，病历上写175cm就行，反正差别不大。（对还是错？）",
 a:["错。所有测量数据必须保留原始精度","数据偏差会导致后续疗效评估失真（如BMI计算错误）","违反数据治理真实性要求"],
 src:"全流程2·10.5避坑指南"},
{n:50, stage:"中期执行", type:"简答", q:"基线CRF的录入时限是什么？还有什么配套要求？",
 a:["电子CRF需在基线检查完成后24小时内录入","录入后需完整上传原始报告附件","不得仅录入数值而无溯源依据"],
 src:"全流程2·10.5避坑指南"},
{n:51, stage:"中期执行", type:"情景", q:"发放首剂药物时做用药指导，参与者问“忘了吃药怎么办”，你怎么回答？",
 a:["必须讲清方案规定的漏服处理规则","绝不能说“忘了就补吃”——可能导致双倍补服引发不良反应","让参与者复述漏服处理方法，确认理解无误"],
 src:"全流程2·10.5避坑指南"},
{n:52, stage:"中期执行", type:"判断", q:"参与者说“我文化低不会写，你帮我填日记卡吧”，CRC可以代填。（对还是错？）",
 a:["错。日记卡不可代参与者填写","指导参与者自己填或家属协助","代填影响数据真实性，监查时会被打回"],
 src:"全流程2·10.5避坑指南"},
{n:53, stage:"中期执行", type:"简答", q:"药物储存发生超温，应急处理的时限和步骤是什么？",
 a:["1小时内响应","立即转移至备用冰箱、报告PI","联系申办方评估药物可用性（是否放行/隔离）","填写温度偏差记录，留存全程证据"],
 src:"全流程2·11.2.2"},
{n:54, stage:"中期执行", type:"简答", q:"试验用药品的库存核对频率和要求是什么？",
 a:["药师每日下班前核对“库存表与实际库存”，确保账物一致","发现差异（如少1片）需当天排查原因，不可拖延至次日","电子库存与手工台账双向核对"],
 src:"全流程2·11.6避坑指南"},
{n:55, stage:"中期执行", type:"简答", q:"盲法试验什么情况下才能紧急揭盲？流程是什么？",
 a:["仅在受试者出现严重不良事件、需紧急救治时","需PI签字审批并填写《紧急揭盲审批单》，记录原因、时间、人员","揭盲后24小时内上报申办者与伦理委员会","严禁擅自破盲"],
 src:"全流程2·11.6避坑指南"},
{n:56, stage:"中期执行", type:"简答", q:"用药依从性的合格范围是多少？低于标准怎么处理？",
 a:["通常为80%-120%（实际使用剂量/方案规定剂量）","低于80%需分析原因（不良反应？遗忘？理解偏差？）","过低（如低于60%）需按规定处理并记录"],
 src:"全流程2·11.3.2"},
{n:57, stage:"中期执行", type:"判断", q:"方案约定每2周随访1次，患者说太频繁，改成每月1次也差不多。（对还是错？）",
 a:["错。访视频率不可随意调整","变更需申办方+伦理审批","擅自调整影响数据完整性与试验科学性"],
 src:"全流程2·12.6避坑指南"},
{n:58, stage:"中期执行", type:"简答", q:"CRF能不能攒到周末一起补填？",
 a:["不能。需在访视当天完成填写，优先实时录入EDC","补填易导致数据记忆偏差","违反ALCOA+的同步性（Contemporaneous）要求"],
 src:"全流程2·12.6避坑指南"},
{n:59, stage:"中期执行", type:"情景", q:"访视时参与者说“就是有点轻微恶心，不用记了吧”，你怎么办？",
 a:["仍需按要求记录（症状、发生时间、严重程度）","未记录的AE在监查/稽查时会被判定为“隐瞒安全信息”","违反受试者安全优先原则"],
 src:"全流程2·12.6/13.5避坑指南"},
{n:60, stage:"中期执行", type:"简答", q:"SAE报告，先交书面报告还是先电话通知？",
 a:["紧急通知优先——获知后立即（24小时内）通知主要研究者、机构、申办方等","书面快速报告随后补充（项目负责人24小时内提交）","顺序颠倒会被判定为“迟报”"],
 pit:"记住一个原则：人命关天的事，电话永远比文件快。", src:"全流程2·13.5避坑指南"},
{n:61, stage:"中期执行", type:"简答", q:"AE与药物的关联性判定，研究者和申办方各承担什么角色？",
 a:["研究者负责初步判定（按给药时间-停药反应-其他诱因流程）","SUSAR的最终判定由申办方完成，研究者不可擅自定性","判定不可仅凭经验写“无关”，需附判定依据"],
 src:"全流程2·13.5避坑指南"},
{n:62, stage:"中期执行", type:"判断", q:"患者脱落后就跟他没关系了，随访也可以停了。（对还是错？）",
 a:["错。脱落患者仍需完成安全性终点随访","不得因脱落放弃安全监测义务","也不可隐瞒脱落、不可诱导脱落患者擅自重新入组"],
 src:"全流程2·16.1.4避坑指南"},
{n:63, stage:"中期执行", type:"简答", q:"监查报告里描述问题，怎么写才算合格？",
 a:["明确“问题具体内容+位置+证据”","如：“XX-002的CRF 7月2日访视页漏填日期”，而不是笼统写“CRF漏填日期”","严重问题需附根本原因分析，不能仅列现象"],
 src:"全流程2·14.5避坑指南"},
{n:64, stage:"中期执行", type:"简答", q:"什么是基于风险的监查（RBM）？远程监查能替代现场监查吗？",
 a:["不搞所有中心、所有模块平均用力，聚焦高风险环节与高风险中心","监查资源匹配到关键质量因素上（QbD要求）","远程监查仅可作为现场监查的补充，不可完全替代"],
 src:"全流程2·14.5避坑指南"},
{n:65, stage:"中期执行", type:"情景", q:"稽查员访谈时问到一个你不确定的问题，应该怎么回答？",
 a:["如实说“这个我需要确认后回复您”","不可猜测（如“大概是这样”）","错误回答会让稽查员质疑其他数据的真实性"],
 pit:"稽查员有丰富经验，隐瞒和瞎猜都会被进一步发现，如实说明+整改措施反而更容易获得认可。", src:"全流程2·15.5避坑指南"},

// ============ 后期收尾 (66-95) ============
{n:66, stage:"后期收尾", type:"判断", q:"数据疑问打个电话跟DM口头说清楚就行，不用录系统。（对还是错？）",
 a:["错。所有答疑结果必须录入EDC系统并上传支持性资料","口头告知无法追溯，数据锁定时会被打回"],
 src:"全流程3·17.7避坑指南"},
{n:67, stage:"后期收尾", type:"简答", q:"数据疑问的描述怎么写才算规范？",
 a:["不说模糊的“数据有误”“指标未填”","要说“XX参与者第X周XX指标录入为XX，与原始报告XX不一致”","让研究者能快速定位问题"],
 src:"全流程3·17.7避坑指南"},
{n:68, stage:"后期收尾", type:"简答", q:"每个数据疑问必须明确哪两个角色？为什么？",
 a:["跟进CRC + 答疑研究者","避免疑问分发后无人负责，超期后无法追溯责任","数据治理类疑问需同步对接申办方数据管理负责人"],
 src:"全流程3·17.7避坑指南"},
{n:69, stage:"后期收尾", type:"情景", q:"你发现EDC一处录入错误，凭经验直接改回来，行吗？",
 a:["不行。需先与研究者核实原始记录，再按流程修正","擅自修正会被判定为“数据造假”","必须留存完整审计轨迹，禁止覆盖原始记录"],
 src:"全流程3·17.7避坑指南"},
{n:70, stage:"后期收尾", type:"简答", q:"AE/合并用药编码，对MedDRA/ATC字典版本有什么要求？",
 a:["所有编码必须使用同一版本（如统一用MedDRA 25.0）","部分参与者用旧版、部分用新版会导致编码混乱，统计分析无法合并数据"],
 src:"全流程3·18.7避坑指南"},
{n:71, stage:"后期收尾", type:"简答", q:"盲态审核除了看组间均衡性，还必须核查哪些量化指标？",
 a:["疑问闭环率100%","核心指标缺失率≤5%","审计轨迹完整率100%"],
 pit:"只盯均衡性、忽略数据缺失和审计轨迹，统计结果会出偏差。", src:"全流程3·18.7避坑指南"},
{n:72, stage:"后期收尾", type:"判断", q:"试验参与者发生SAE，情况紧急，研究者可以直接破盲救治后再补流程。（对还是错？）",
 a:["基本错——按流程提交破盲申请、经审批后再执行","即使SAE也需走审批流程，擅自破盲是严重违规","破盲操作必须留存完整审计轨迹"],
 pit:"注意与“紧急揭盲”区分：紧急救治场景下揭盲有快速通道，但事后24小时内必须补齐上报（申办方+伦理）。", src:"全流程3·18.7避坑指南"},
{n:73, stage:"后期收尾", type:"简答", q:"DM做完的编码结果，还需要谁复核？",
 a:["需经统计师复核","避免“同一AE不同编码”“药物编码与类别不符”","编码修正全程留痕，禁止直接覆盖原始编码"],
 src:"全流程3·18.7避坑指南"},
{n:74, stage:"后期收尾", type:"判断", q:"99条疑问都闭环了，就剩1条一般疑问，可以先锁库再补。（对还是错？）",
 a:["错。数据锁定条件需100%满足","即使仅1条疑问未闭环、1例编码遗漏、1条审计轨迹缺失，也不可启动锁定","否则统计分析结果失真，会被监管部门质疑"],
 src:"全流程3·19.7避坑指南"},
{n:75, stage:"后期收尾", type:"简答", q:"数据锁定会议怎么开才算合规？",
 a:["确保所有关键人员参会、充分讨论","不可“签字了事”；未参会人员意见需提前收集","PI与申办方负责人必须确认签字，明确最终责任"],
 src:"全流程3·19.7避坑指南"},
{n:76, stage:"后期收尾", type:"简答", q:"锁定后的数据备份有什么要求？",
 a:["执行“三重备份”，不可单一介质（仅本地硬盘或仅云端）","同步备份元数据与审计轨迹","确保数据全生命周期可追溯"],
 src:"全流程3·19.7避坑指南"},
{n:77, stage:"后期收尾", type:"简答", q:"数据锁定后还能改数据吗？",
 a:["锁定后修改需经申办方审批（解锁流程）","擅自修改会被判定为“数据造假”","所有修改留存完整审计轨迹，禁止覆盖原始锁定版本"],
 src:"全流程3·19.7避坑指南"},
{n:78, stage:"后期收尾", type:"简答", q:"数据锁定前的核心条件清单包括哪些？（说出4项）",
 a:["所有数据疑问闭环","AE/合并用药编码完成","盲态审核通过（双盲试验）","数据治理合规性核查通过、审计轨迹完整性确认","SAE报告全部闭环"],
 src:"全流程3·19.3.1"},
{n:79, stage:"后期收尾", type:"简答", q:"ITT/PP/SS分析人群的定义，中途能调整吗？",
 a:["严格按SAP执行，不可中途变更（如随意扩大PP人群范围）","人群定义需与估计目标策略一一对应","变更会导致结果偏倚，被监管部门质疑"],
 src:"全流程3·20.7避坑指南"},
{n:80, stage:"后期收尾", type:"情景", q:"预设的t检验分析结果P=0.07，没有统计显著性，换成非参数检验P=0.04就“好看”了，能换吗？",
 a:["不能。统计方法不可偏离SAP","即使预设方法无统计显著性，也需在SAR中如实说明“方法与SAP一致，结果无统计显著性”","数据锁定后禁止实质性修改SAP，仅允许文字性修订"],
 pit:"换方法“救”结果，等于给监管递把柄。", src:"全流程3·20.7避坑指南"},
{n:81, stage:"后期收尾", type:"判断", q:"P<0.05说明药物有效，可以在报告里写“疗效显著优于对照组”。（对还是错？）",
 a:["错。P<0.05只是“有统计学显著性差异”，“显著优于”是夸大解读","如HbA1c下降0.1%有统计显著性但无临床获益","需结合临床实际、估计目标综合评估"],
 src:"全流程3·20.7/22.7避坑指南"},
{n:82, stage:"后期收尾", type:"判断", q:"主要疗效指标没有达到统计显著性，这部分结果可以在CSR里淡化处理甚至不写。（对还是错？）",
 a:["错。阴性结果需完整呈现，不可选择性省略","隐瞒阴性结果会被判定为数据造假","同样适用于：次要指标不佳、亚组结果不佳、方案偏离率较高"],

const STAGES = ["全部","GCP法规","前期准备","中期执行","后期收尾","综合踩坑"];
const KEY = "ct_quiz_progress_v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}"); // n -> "ok"|"no"
let curStage = "全部", curState = "all";

const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function stats(){
  const vals = Object.values(state);
  const ok = vals.filter(v=>v==="ok").length, no = vals.filter(v=>v==="no").length;
  $("s-done").textContent = ok+no; $("s-ok").textContent = ok; $("s-no").textContent = no;
  $("s-total").textContent = QS.length;
  $("bar").style.width = ((ok+no)/QS.length*100)+"%";
}

function render(){
  const list = $("list"); list.innerHTML = "";
  let shown = 0;
  QS.forEach(q => {
    if(curStage!=="全部" && q.stage!==curStage) return;
    const st = state[q.n];
    if(curState==="todo" && st) return;
    if(curState==="ok" && st!=="ok") return;
    if(curState==="no" && st!=="no") return;
    shown++;
    const card = document.createElement("div");
    card.className = "qcard" + (st==="ok"?" right":st==="no"?" wrong":"");
    const typeCls = q.type==="情景"?"tag scene":q.type==="判断"?"tag judge":"tag";
    card.innerHTML = `
      <div class="qtop">
        <span class="num">第 ${q.n} 题</span>
        <span class="${typeCls}">${q.type}</span>
        <span class="tag" style="background:#f3f4f6;color:#6b7280">${q.stage}</span>
      </div>
      <div class="qtext">${q.q}</div>
      <div class="ans" id="ans-${q.n}">
        <ul>${q.a.map(x=>`<li>${x}</li>`).join("")}</ul>
        ${q.pit?`<div class="pit">⚠ ${q.pit}</div>`:""}
        <div class="src">来源：${q.src}</div>
      </div>
      <div class="ops">
        <button class="btn btn-primary" onclick="toggle(${q.n})">${st?"收起答案":"显示答案"}</button>
        ${st?`
          <button class="btn btn-ok" onclick="mark(${q.n},'ok')">✓ 答对了</button>
          <button class="btn btn-no" onclick="mark(${q.n},'no')">✗ 答错了</button>
          <span class="verdict ${st}">${st==="ok"?"已标记：答对":"已标记：答错"}</span>
        `:""}
      </div>`;
    if(st){ card.querySelector(".ans").classList.add("show"); }
    list.appendChild(card);
  });
  $("count").textContent = `当前筛选显示 ${shown} 题`;
}

function toggle(n){
  const el = $("ans-"+n);
  el.classList.toggle("show");
  const btn = el.parentElement.querySelector(".btn-primary");
  btn.textContent = el.classList.contains("show")?"收起答案":"显示答案";
}
function mark(n, v){
  state[n]=v; save(); stats(); render();
}
function resetAll(){
  if(confirm("确定清空所有作答记录吗？")){
    state={}; save(); stats(); render();
  }
}

// tabs
const tabs = $("tabs");
STAGES.forEach(s=>{
  const t=document.createElement("div");
  t.className="tab"+(s==="全部"?" on":""); t.textContent=s;
  t.onclick=()=>{ curStage=s; document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on"); render(); };
  tabs.appendChild(t);
});
$("fstate").onchange=e=>{ curState=e.target.value; render(); };
$("reset").onclick=resetAll;
stats(); render();
</script>
